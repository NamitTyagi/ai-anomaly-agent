name: Daily Olist Anomaly Check

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full monitoring pipeline
        run: python run_all.py

      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/olist_daily_metrics.csv alerts.db anomaly_report.txt dashboard_data.json dashboard.html index.html
          git diff --cached --quiet || git commit -m "chore: refresh anomaly monitoring outputs"
          git push

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-report
          path: anomaly_report.txt
